    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash svg { width: 96px; height: 96px; animation: bloom 1.6s ease-in-out infinite; }
    @keyframes bloom { 50% { transform: scale(0.92); opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }

      var splash = document.getElementById('splash');
      if (splash) splash.remove();
